<!DOCTYPE html>
<html lang="en">
<head>
    <title>Document</title>
</head>
<body>
    <form>
<label>Enter  Monil numebr </label>
<input type="text"id="mob">
<br>
<label>Stun the  ID</label>
<input type="number" id="sid">
<br>
<label>Stundt Name</label>
<input type="text" id="name">
<br>
<label>CITY</label>
<input type="text" id="city">
<br>

<input type="submit" onclick="event.preventDefault(); show();">
</form>
<div id="msg"></div>

<script>

function show()
{

    let mob=document.getElementById("mob").value;
    let sid=document.getElementById("sid").value;
    let name=document.getElementById("name").value;
    let city =document.getElementById("city").value;

    let sam =new XMLHttpRequest();
    sam.open("GET","testing.php?mob="+mob+"&sid="+sid+"&name="+name+"&city="+city,true);

    sam.send();
    sam.onreadystatechange=function()
    {
        if(this.readyState==4&&this.status==200)
    {

        document.getElementById("msg").innerHTML=this.responseText;


    }
    }
}


</script>




</body>
</html>
