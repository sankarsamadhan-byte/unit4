<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <form>

<label>Enter th NAME</label>
<input type="text" id="name" name="name" onkeyup="vali()">
<br>

    </form>
<div id="mag"></div>

<script>

function vali()
{
        let name=document.getElementById("name").value;
        let sam =new XMLHttpRequest();
        sam.open("GET","Q9.php?name="+name,true);
        sam.send();
        sam.onreadystatechange=function()
        {
            if(this.readyState==4&&this.status==200)
        {
            document.getElementById("mag").innerHTML=this.responseText;

        }
        }


}


</script>


</body>
</html>
