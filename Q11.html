<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <form>    <label>INpur  enete </label>
    <input type="number" id="num" name="num" onkeyup="show()">
</form>
<div id="msg"></div>
    <script>
        function show()
        {
            let name=document.getElementById("num").value;
            let sam =new XMLHttpRequest();
            sam.open("GET","testing.php?name="+name,true);
            sam.send();
            sam.onreadystatechange=function()
            {
                if(this.readyState==4&&this.status==200)
            {
                document.getElementById("msg").innerHTML=this.responseText;
            }
            }
        }



    </script>
</body>
</html>
