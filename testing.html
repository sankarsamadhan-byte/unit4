<!DOCTYPE html>

<html>
<body>

<form onsubmit="event.preventDefault(); show();">

```
Enter Mobile Number:
<input type="text" id="mon"><br><br>

Enter ID:
<input type="number" id="sid"><br><br>

Enter Name:
<input type="text" id="name"><br><br>

Enter Country:
<input type="text" id="city"><br><br>

<input type="submit" value="OK">
```

</form>

<div id="msg"></div>

<script>
function show() {
    let mob = document.getElementById("mon").value;
    let sid = document.getElementById("sid").value;
    let name = document.getElementById("name").value;
    let city = document.getElementById("city").value;

    let sam = new XMLHttpRequest();

    sam.open("GET", "testing.php?mob=" + mob +
        "&sid=" + sid +
        "&name=" + name +
        "&city=" + city, true);

    sam.onreadystatechange = function() {
        if (this.readyState == 4 && this.status == 200) {
            document.getElementById("msg").innerHTML = this.responseText;
        }
    };

    sam.send();
}
</script>

</body>
</html>
