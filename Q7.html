<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <form>
        <label>EntetheString</label>
        <input type="text" id="str" name="str"
        onkeyup="show()">
    </form>
<div id="msg"></div>
<script>

function show()
{

        let name=document.getElementById("str").value;
        let sam =new XMLHttpRequest();
        sam.open("GET","Q7.php?name="+name,true);
        sam.send();
        sam.onreadystatechange=function()
        {
            if(this.readyState==4&&this.status==200)
        {
                document.getElementById("msg").innerHTML=this.responseText;

        }

        }



}

</script>    
</body>
</html>
