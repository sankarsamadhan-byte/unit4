<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
<form>
<label>Text</label>
<input type="text" id="s1" name="s1" onkeyup="wel()">
</form>
<div id="msg"></div>
    
<script>

function wel()
{
    var name=document.getElementById("s1").value;
    var sam =new XMLHttpRequest();
    sam.open("GET","Q2.php?name="+name,true);
    sam.send();
    sam.onreadystatechange=function(){

            if(this.readyState==4&&this.status==200)
            {
                document.getElementById("msg").innerHTML=this.responseText;
            }

    }
    {

    }


}

</script>

</body>
</html>
